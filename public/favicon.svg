<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="p1Grad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="45%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Squircle Base with Vibrant Gradient -->
  <rect width="64" height="64" rx="18" fill="url(#p1Grad)" />
  <rect width="64" height="64" rx="18" fill="url(#sheen)" />

  <!-- P1 Serving Cloche + Pulse -->
  <!-- Top Cloche Handle -->
  <circle cx="32" cy="13" r="3.5" fill="#FFFFFF" />

  <!-- Serving Cloche Dome -->
  <path d="M13 37 C13 22 22 17 32 17 C42 17 51 22 51 37" stroke="#FFFFFF" stroke-width="3.8" stroke-linecap="round" />

  <!-- Platter Base Line -->
  <path d="M9 42.5 H55" stroke="#FFFFFF" stroke-width="3.8" stroke-linecap="round" />

  <!-- Heart / Vital Core Center Accent -->
  <path d="M32 26.5 C30 23.5 25 24 25 28 C25 32 32 36.5 32 36.5 C32 36.5 39 32 39 28 C39 24 34 23.5 32 26.5 Z" fill="#FFFFFF" fill-opacity="0.25" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Dynamic Real-Time ECG Heartbeat / Kitchen Pulse Wave -->
  <path d="M16 32 H23 L27 26.5 L31.5 36.5 L35.5 24.5 L39 32 H48" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
